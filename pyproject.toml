[project]
name = "wordlehands"
version = "0.1.0"
description = "Computer-use automation system: LLM discovery, deterministic replay, and human escalation, demonstrated against a live Wordle-clone surface."
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.47",
    "openai>=1.50",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
wordlehands = "wordlehands.cli:cli"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: str+Enum mixins are used deliberately and consistently across the
# artifact/surface schemas for pydantic (de)serialization; converting to
# StrEnum is a style preference, not a bug, and not worth the diff.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# The discovery system prompt is natural-language prose, not code — wrapping
# it mechanically would hurt readability of the actual sentences for no
# benefit; the tool-def description strings alongside it are the same.
"src/wordlehands/agent/loop.py" = ["E501"]
"src/wordlehands/agent/tools.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
